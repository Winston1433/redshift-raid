<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TETRIS · 俄羅斯方塊</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <div class="container">
    <header class="topbar">
      <h1>TETRIS</h1>
      <span class="subtitle">俄羅斯方塊</span>
    </header>

    <div class="layout">
      <div class="side left">
        <div class="stat">
          <label>SCORE</label>
          <b id="score">0</b>
        </div>
        <div class="stat">
          <label>BEST</label>
          <b id="highscore">0</b>
        </div>
        <div class="stat">
          <label>LEVEL</label>
          <b id="level">1</b>
        </div>
      </div>

      <div class="game-area">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-content">
            <h2 id="overlay-title">TETRIS</h2>
            <p id="overlay-text">排滿一整行即可消除<br>堆到頂端就結束</p>
            <button id="start-btn" class="big-btn">開始遊戲</button>
          </div>
        </div>
      </div>

      <div class="side right">
        <div class="stat">
          <label>NEXT</label>
          <canvas id="next" width="120" height="120"></canvas>
        </div>
      </div>
    </div>

    <div class="mobile-controls">
      <button class="ctrl-btn" data-act="left" aria-label="左移">←</button>
      <button class="ctrl-btn" data-act="rotate" aria-label="旋轉">⟳</button>
      <button class="ctrl-btn" data-act="right" aria-label="右移">→</button>
      <button class="ctrl-btn" data-act="down" aria-label="加速">↓</button>
      <button class="ctrl-btn wide" data-act="drop" aria-label="落底">落底</button>
    </div>

    <p class="hint">鍵盤：<kbd>←</kbd><kbd>→</kbd> 移動 · <kbd>↑</kbd> 旋轉 · <kbd>↓</kbd> 加速 · <kbd>Space</kbd> 落底</p>
  </div>
  <script src="game.js?v=2"></script>
</body>
</html>
