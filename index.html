<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>貪吃蛇 Snake Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🐍 貪吃蛇</h1>
    <div class="scoreboard">
      <span>分數：<b id="score">0</b></span>
      <span>最高分：<b id="highscore">0</b></span>
    </div>

    <div class="game-area">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <h2 id="overlay-title">🐍 貪吃蛇</h2>
          <p id="overlay-text">吃到紅色小球就加分<br>不要撞到牆壁和自己</p>
          <button id="start-btn" class="big-btn">▶ 開始遊戲</button>
        </div>
      </div>
    </div>

    <!-- 螢幕方向按鈕（手機也能玩） -->
    <div class="dpad">
      <div></div>
      <button class="dpad-btn" data-dir="up">↑</button>
      <div></div>
      <button class="dpad-btn" data-dir="left">←</button>
      <button class="dpad-btn" data-dir="down">↓</button>
      <button class="dpad-btn" data-dir="right">→</button>
    </div>

    <p class="hint">也可以用電腦鍵盤的方向鍵 <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 控制</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
