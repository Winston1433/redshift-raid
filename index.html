<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2ead5">
  <title>赤砂突襲 — Redshift Raid</title>
  <link rel="stylesheet" href="./style.css?v=redshift-2">
  <script src="./game.js?v=redshift-2" defer></script>
</head>
<body>
  <main>
    <canvas id="flight" aria-label="赤砂峽谷飛行戰場" tabindex="-1"></canvas>
    <section id="briefing" aria-labelledby="headline">
      <div class="mast"><span class="mark" aria-hidden="true">✦</span> <span>REDSHIFT RAID</span></div>
      <div class="brief">
        <h1 id="headline">赤砂<br>突襲</h1>
        <p id="summary">穿越三道封鎖線，擊落各關母艦。</p>
        <div id="difficultyPicker">
          <label for="difficulty">難度</label>
          <select id="difficulty" aria-describedby="difficultyHint">
            <option value="easy">簡單</option>
            <option value="normal" selected>普通</option>
            <option value="hard">困難</option>
          </select>
          <p id="difficultyHint">4 格耐久，標準彈速。</p>
        </div>
        <button id="launch" type="button">出擊 <span aria-hidden="true">↗</span></button>
        <p id="briefControls"><span class="desktop">方向鍵／WASD 移動 · 空白鍵射擊 · X 脈衝</span><span class="touch">拖曳戰機移動並開火 · 點「脈衝」清除彈幕</span></p>
      </div>
    </section>
    <div id="hud" hidden>
      <div class="readout">
        <span>機體</span>
        <div class="health" id="health" role="meter" aria-label="機體耐久" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4"><i></i><i></i><i></i><i></i><i hidden></i></div>
      </div>
      <div class="readout score"><span>分數</span><strong id="points">00000</strong></div>
      <button id="pause" type="button" aria-label="暫停">Ⅱ</button>
      <div class="navigation">
        <span id="status">1 / 3 · 赤砂峽谷</span>
        <div class="track" aria-hidden="true"><div id="progress"></div></div>
      </div>
      <button id="pulse" type="button"><strong>脈衝</strong><span id="charge">100%</span></button>
    </div>
  </main>
</body>
</html>
